<script>    (() => {
      'use strict';
      const utf8Encoder=new TextEncoder();
      const utf8Bytes=str=>utf8Encoder.encode(str).length;
      // Real device transport; rendering below remains the selected Gemini design.
      let csrf = '', revision = 0, polling = false, timer = null, everLoaded = false;
      let wifiEditRevision = 0, serviceEditRevision = 0, wifiSubmitted = null;
      let serviceSubmitted = false, composing = false;
      const store = {

        device: {wifi: {}, local_only: false, configured: false, pairing: false, server_url: ''},

        wifiEdited: false, customSsidMode: false, wifiMenuOpen: false, draftSsid: '', draftPassword: '',
        exitFeedback: {text: '', tone: ''}, showPassword: false, wifiFeedback: {text: '', tone: ''},
        serviceEdited: false, draftMode: 'service', draftServerUrl: '', draftPairingCode: '',
        serviceFeedback: {text: '', tone: ''}, candA_wifiOpen: false, candA_serviceOpen: false
      };
      function writable() { return store.apOnline && csrf && !store.closed && !store.pendingWrite && !store.scanning; }
      function syncDrafts() {
        if (!store.wifiEdited) {
          store.draftSsid = store.device.wifi.ssid || '';
          store.customSsidMode = !!store.draftSsid && !store.aps.some(a => a.ssid === store.draftSsid);
        }
        if (!store.serviceEdited) {
          store.draftMode = store.device.local_only ? 'local' : 'service';
          store.draftServerUrl = store.device.server_url || '';
        }
      }
      async function status() {
        if (polling || store.pendingWrite || store.closed) return;
        clearTimeout(timer); polling = true;
        const observed = revision;
        try {
          const value = await requestJson('/service');
          if (observed !== revision || store.pendingWrite || store.closed) return;
          if (typeof value.csrf !== 'string' || !value.csrf || !value.wifi ||
              typeof value.wifi.state !== 'string' || typeof value.wifi.connected !== 'boolean' ||
              typeof value.wifi.saved !== 'boolean' || typeof value.local_only !== 'boolean' ||
              typeof value.configured !== 'boolean' || typeof value.pairing !== 'boolean' ||
              typeof value.phase !== 'string' || typeof value.server_url !== 'string') throw Error('Invalid device state');
          csrf = value.csrf; store.device = value; store.apOnline = true;
          syncDrafts();
          if (!everLoaded) {
            store.candA_wifiOpen = (!value.wifi.connected || !value.wifi.saved) && !value.local_only;
            store.candA_serviceOpen = value.phase === 'error' || value.phase === 'unconfigured';
          }
          everLoaded = true;
          const w = value.wifi;
          if (wifiSubmitted && w.ssid === wifiSubmitted.ssid) {
            if (w.connected && w.saved) {
              if (wifiEditRevision === wifiSubmitted.editRevision) {
                store.draftPassword = ''; store.wifiEdited = false; store.candA_wifiOpen = false; store.wifiMenuOpen = false;
              }
              store.wifiFeedback = {text: '', tone: ''}; wifiSubmitted = null;
            } else if (w.state === 'failed' || w.state === 'save_failed') {
              store.wifiFeedback = {text: '', tone: ''}; wifiSubmitted = null;
              store.candA_wifiOpen = true;
            }
          }

      // Preserve actual controls (and iOS keyboard/IME selection) across status updates.
      function reconcile(parent, desired) {
        const incoming=[...desired.childNodes];
        for(let i=0;i<incoming.length;i++) {
          const fresh=incoming[i]; let old=parent.childNodes[i];
          const key=n=>n.nodeType===1 ? (n.id || (n.dataset.action ? n.dataset.action+':'+(n.dataset.mode||n.dataset.wifiOpt||'') :
            n.tagName+':'+(n.getAttribute('class')||'')+':'+(n.getAttribute('for')||((n.classList.contains('f-group')||n.classList.contains('f-label-row'))?n.querySelector('label')?.htmlFor:'')||'')+':'+(n.tagName==='OPTION'?n.getAttribute('value')||'':''))) : '';
          if(key(fresh) && (!old || key(old)!==key(fresh))) {
            const match=[...parent.childNodes].slice(i).find(n=>key(n)===key(fresh));
            if(match){parent.insertBefore(match,old||null);old=match;}
            else {parent.insertBefore(fresh.cloneNode(true),old||null);continue;}
          }
          if(!old){parent.appendChild(fresh.cloneNode(true));continue;}
          if(old.nodeType!==fresh.nodeType || old.nodeName!==fresh.nodeName || key(old)!==key(fresh)) {parent.replaceChild(fresh.cloneNode(true),old);continue;}
          if(old.nodeType!==1){if(old.nodeValue!==fresh.nodeValue)old.nodeValue=fresh.nodeValue;continue;}
          if(old.tagName.toLowerCase()==='svg'){if(old.outerHTML!==fresh.outerHTML)parent.replaceChild(fresh.cloneNode(true),old);continue;}
          for(const a of [...old.attributes])if(!fresh.hasAttribute(a.name))old.removeAttribute(a.name);
          for(const a of [...fresh.attributes])if(old.getAttribute(a.name)!==a.value)old.setAttribute(a.name,a.value);
          if(old.tagName==='INPUT') {if(old.value!==fresh.value)old.value=fresh.value;}
          else {reconcile(old,fresh);if(old.tagName==='SELECT' && old.value!==fresh.value)old.value=fresh.value;}
        }
        while(parent.childNodes.length>incoming.length)parent.lastChild.remove();
      }

      function createTimeoutSignal(ms) {
        if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
          return AbortSignal.timeout(ms);
        }
        const controller = new AbortController();
        setTimeout(() => controller.abort(new DOMException('TimeoutError', 'TimeoutError')), ms);
        return controller.signal;
      }

      async function requestJson(url, options = {}) {
        let response;
        try {
          response = await fetch(url, {
            cache: 'no-store',
            signal: createTimeoutSignal(8000),
            ...options
          });
        } catch (err) {
          const isTimeout = err && (err.name === 'TimeoutError' || err.name === 'AbortError');
          if (isTimeout) {
            throw new Error('等待设备响应超时（操作结果尚未确认，设备可能仍在继续处理）；请保持连接IdeaPickup热点，稍后查看上方最新状态');
          }
          throw new Error('未能收到设备响应（操作结果尚未确认）；请确认手机仍连着IdeaPickup热点，连接恢复后将自动更新状态');
        }

        let rawText = '';
        try {
          rawText = await response.text();
        } catch (_) {
          throw new Error('设备响应读取未完成，请稍后重试');
        }

        let value = null;
        if (rawText) {
          try {
            value = JSON.parse(rawText);
          } catch (_) {
            value = null;
          }
        }

        if (!response.ok) {
          if (value && typeof value.error === 'string' && value.error.trim()) {
            throw new Error(value.error.trim());
          }
          if (value && typeof value.message === 'string' && value.message.trim()) {
            throw new Error(value.message.trim());
          }
          const cleanPlain = rawText ? rawText.replace(/\s+/g, ' ').trim().slice(0, 120) : '';
          if (response.status === 403) {
            throw new Error(cleanPlain || '页面会话已更新，正在重新同步设备状态，请稍后再试');
          }
          if (response.status === 409) {
            throw new Error(cleanPlain || '设备当前正忙或设置条件冲突，请检查后重试');
          }
          if (response.status >= 500) {
            throw new Error(cleanPlain || '设备处理请求时遇到问题，请稍后重试');
          }
          throw new Error(cleanPlain || '请求未能完成，请检查输入后重试');
        }

        if (!value || typeof value !== 'object') {
          throw new Error('设备返回内容无法识别，请稍后重试');
        }

        if (url !== '/scan' && !value.success) {
          throw new Error(value.error || value.message || '设备暂不可用，请稍后重试');
        }

        return value;
      }

              <label class="f-label" for="srv-url-input">服务器地址</label>
              ${urlTooLong
                ? '<span class="f-err-inline">地址超长</span>'
                : (store.serviceEdited && store.apOnline && !store.closed
                    ? '<button type="button" class="f-link-btn" data-action="reset-service-draft">还原修改</button>'
                    : '')}
            </div>
            <input
              id="srv-url-input"
              class="portal-input"
              type="text"
              inputmode="url"
              maxlength="240"
              autocomplete="url"
              autocapitalize="none"
              spellcheck="false"
              placeholder="内网 IP (默认8765) 或 https://域名"
              value="${escapeAttr(store.draftServerUrl)}"
              ${disabled ? 'disabled' : ''}
            >
          </div>

          <div class="f-group">
            <div class="f-label-row">
              <label class="f-label" for="srv-code-input">配对码</label>
              ${codeTooLong ? '<span class="f-err-inline">最多 16 位</span>' : ''}
            </div>
            <input
              id="srv-code-input"
              class="portal-input"
              type="text"
              maxlength="16"
              autocomplete="one-time-code"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="${hasExistingServer ? '不换服务器可留空；换新地址需填新码' : '在服务器管理页生成'}"
              value="${escapeAttr(store.draftPairingCode)}"
              ${disabled ? 'disabled' : ''}
            >
          </div>

          ${store.serviceFeedback.text ? `
            <div class="f-feedback" data-tone="${store.serviceFeedback.tone}" role="status" aria-live="polite">
              ${escapeHtml(store.serviceFeedback.text)}
            </div>
          ` : ''}

          <button
            type="button"
            class="f-primary-btn"
            style="${btnColorStyle}"
            data-action="submit-service"
            ${disabled ? 'disabled' : ''}
          >
            ${btnText}
          </button>
        `;
      }

      // Concise Local Mode Panel:
      // - When already active on device: 1 calm line, NO redundant disabled button or repeated status badge.
      // - When newly selected as draft: 1 brief explanation + primary save button.
      function renderLocalModeAction(btnColorStyle) {
        const disabled = store.closed || !store.apOnline || store.pendingWrite || store.scanning;
        const alreadyLocalOnDevice = Boolean(store.device.local_only) && store.apOnline && !store.closed;

        if (alreadyLocalOnDevice) {
          return `
            <div style="font-size:0.8125rem; color:#52525B; line-height:1.45;">
              插存储卡即可离线录音与回放，不联网同步（原服务器地址已保留）。
            </div>
          `;
        }

        return `
          <div style="font-size:0.8125rem; color:#52525B; line-height:1.45; margin-bottom:10px;">
            切换后停止联网同步，插存储卡可离线录音与回放（原服务器地址会保留）。
          </div>

          ${store.serviceFeedback.text ? `
            <div class="f-feedback" data-tone="${store.serviceFeedback.tone}" role="status" aria-live="polite">
              ${escapeHtml(store.serviceFeedback.text)}
            </div>
          ` : ''}

          <button
            type="button"
            class="f-primary-btn"
            style="${btnColorStyle}"
            data-action="submit-service"
            ${disabled ? 'disabled' : ''}
          >
            启用仅本地使用
          </button>
        `;
      }

      function renderCandidateA() {
        const w = deriveWifiInfo();
        const s = deriveServiceInfo();

        return `
          <main class="theme-a" aria-label="IdeaPickup 联网与服务设置">
            <header class="a-header">
              <h1 class="a-title">IdeaPickup · 联网与服务设置</h1>
              <span class="a-ap-pill" data-tone="${store.apOnline ? 'neutral' : 'error'}" role="status">
                ${store.closed ? '○ 热点已关' : store.apOnline ? '● 热点已连' : '✕ 热点失联'}
              </span>
            </header>

            ${!store.apOnline || store.closed ? `
              <div class="a-alert-strip" data-tone="${store.closed ? 'neutral' : 'error'}" role="status" aria-live="polite">
                <div>
                  <strong>${store.closed ? '已请求关闭配置热点，页面停止更新' : '与设备热点连接中断'}</strong>
                  ${!store.closed ? '<div style="margin-top:2px;">请确认手机仍连着设备热点；重连后自动恢复实时状态。</div>' : ''}
                </div>
                ${!store.closed ? `<button type="button" class="a-action-btn" data-action="reconnect-ap">重连</button>` : ''}
              </div>
            ` : ''}

            <!-- Item 1: Wi-Fi Row + Expandable Drawer -->
            <section class="a-row-item" aria-label="Wi-Fi 网络">
              <div class="a-row-summary">
                <div class="a-row-meta">
                  <div class="a-row-label">Wi-Fi 网络</div>
                  <div class="a-row-value">
                    <span class="a-status-tag" role="status" aria-live="polite" data-tone="${w.tone}">${w.icon} ${escapeHtml(w.short)}</span>
                  </div>
                  ${w.note ? `<div class="a-row-sub">${escapeHtml(w.note)}</div>` : ''}
                </div>
                <button
                  type="button"
                  class="a-action-btn"
                  data-primary="${!w.isReady && !store.candA_wifiOpen ? 'true' : 'false'}"
                  data-action="toggle-a-wifi" aria-expanded="${store.candA_wifiOpen}"
                  ${store.closed ? 'disabled' : ''}
                >
                  ${store.candA_wifiOpen ? '收起' : (w.isReady ? '更换' : '配置')}
                </button>
              </div>

              ${store.candA_wifiOpen ? `
                <div class="a-drawer">
                  ${renderUnifiedWifiControls('background:#18181B; color:#FFFFFF;')}
                </div>
              ` : ''}
            </section>

            <!-- Item 2: Mode Segmented Switcher + Service Config -->
            <section class="a-row-item" aria-label="工作模式与转写服务">
              <div class="a-seg-wrap">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
                  <span class="a-row-label" style="margin:0;">工作模式</span>
                  <span class="a-status-tag" role="status" aria-live="polite" data-tone="${s.tone}">${s.icon} ${escapeHtml(s.short)}</span>
                </div>

                ${s.note ? `<div class="a-row-sub" style="margin-top:6px;">${escapeHtml(s.note)}</div>` : ''}

                <div class="a-seg-track" role="group" aria-label="选择工作模式">
                  <button
                    type="button"
                    class="a-seg-btn"
                    aria-pressed="${store.draftMode === 'service'}"
                    data-action="set-mode"
                    data-mode="service"
                    ${store.closed ? 'disabled' : ''}
                  >
                    转写服务
                  </button>
                  <button
                    type="button"
                    class="a-seg-btn"
                    aria-pressed="${store.draftMode === 'local'}"
                    data-action="set-mode"
                    data-mode="local"
                    ${store.closed ? 'disabled' : ''}
                  >
                    仅本地使用
                  </button>
                </div>

                ${store.draftMode === 'local' ? `
                  ${renderLocalModeAction('background:#18181B; color:#FFFFFF;')}
                ` : `
                  ${(!store.candA_serviceOpen && s.isPaired && !store.serviceEdited) ? `
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                      <span style="font-size:0.8125rem; color:#52525B;">支持无卡录音与自动同步转写</span>
                      <button type="button" class="a-action-btn" data-action="toggle-a-service" aria-expanded="${store.candA_serviceOpen}">修改服务器</button>
                    </div>
                  ` : `
                    <div style="background:#F6F5F2; padding:12px; border-radius:10px; border:1px solid #D6D3CD;">
                      ${renderServiceFieldsControls('background:#18181B; color:#FFFFFF;')}
                    </div>
                  `}
                `}
              </div>
            </section>

            <!-- Item 3: Explicit Hotspot Exit -->
            <footer style="margin-top:14px; text-align:center;">
              ${store.exitFeedback.text ? `<div class="f-feedback" data-tone="${store.exitFeedback.tone}" role="status" aria-live="polite">${escapeHtml(store.exitFeedback.text)}</div>` : ''}
              <button
                type="button"
                class="a-action-btn"
                style="width:100%;"
                data-action="exit-hotspot"
                ${store.closed || !store.apOnline || store.pendingWrite ? 'disabled' : ''}
              >
                ${store.closed ? '配置热点已关闭' : '完成并关闭配置热点'}
              </button>
            </footer>
          </main>
        `;
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function escapeAttr(str) {
        return escapeHtml(str);
      }

      function applyWifiSelection(val) {
        store.wifiEdited = true; wifiEditRevision++;
        store.wifiMenuOpen = false;
        if (val === 'custom') {
          store.customSsidMode = true;
          if (store.aps.some((a) => a.ssid === store.draftSsid)) {
            store.draftSsid = '';
          }
          render();
          const input = document.getElementById('wifi-ssid-input');
          if (input) input.focus();
        } else {
          store.customSsidMode = false;
          store.draftSsid = val.startsWith('ap:') ? (store.aps[Number(val.slice(3))]?.ssid || '') : '';
          render();
          if (val) {
            const pwd = document.getElementById('wifi-pwd-input');
            if (pwd) pwd.focus();
          }
        }
      }

      document.getElementById('portal-mount').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn || btn.disabled) return;
        const action = btn.dataset.action;

        if (action === 'toggle-a-wifi') {
          store.candA_wifiOpen = !store.candA_wifiOpen;
          if (!store.candA_wifiOpen) store.wifiMenuOpen = false;
          render();
        } else if (action === 'toggle-wifi-menu') {
          store.wifiMenuOpen = !store.wifiMenuOpen;
          render();
          if (store.wifiMenuOpen) {
            const activeOpt = document.querySelector('#wifi-net-listbox .wifi-opt-btn[aria-selected="true"]') || document.querySelector('#wifi-net-listbox .wifi-opt-btn');
            if (activeOpt) activeOpt.focus();
          }
        } else if (action === 'pick-wifi') {
          applyWifiSelection(btn.dataset.wifiOpt || '');
        } else if (action === 'toggle-a-service') {
          store.candA_serviceOpen = !store.candA_serviceOpen;
          render();
        } else if (action === 'set-mode') {
          const targetMode = btn.dataset.mode;
          if (targetMode && targetMode !== store.draftMode) {
            store.draftMode = targetMode;
            const currentDeviceMode = store.device.local_only ? 'local' : 'service';
            store.serviceEdited = store.serviceEdited || (targetMode !== currentDeviceMode); serviceEditRevision++;
            store.serviceFeedback = { text: '', tone: '' };
            if (targetMode === 'service') {
              store.candA_serviceOpen = true;
            }
            render();
          }
        } else if (action === 'toggle-pwd') {
          store.showPassword = !store.showPassword;
          render();
        } else if (action === 'scan-wifi') {
          triggerScan();
        } else if (action === 'submit-wifi') {
          submitWifi();
        } else if (action === 'submit-service') {
          submitService();
        } else if (action === 'reset-wifi-draft') {
          store.wifiEdited = false; wifiEditRevision++;
          store.draftSsid = store.device.wifi.ssid || '';
          store.draftPassword = '';
          store.customSsidMode = false;
          store.wifiMenuOpen = false;
          store.wifiFeedback = { text: '', tone: '' };
          render();
        } else if (action === 'reset-service-draft') {
          store.serviceEdited = false; serviceEditRevision++;
          store.draftMode = store.device.local_only ? 'local' : 'service';
          store.draftServerUrl = store.device.server_url || '';
          store.draftPairingCode = '';
          store.serviceFeedback = { text: '', tone: '' };
          render();
        } else if (action === 'reconnect-ap') {
          status();
        } else if (action === 'exit-hotspot') {
          triggerExitHotspot();
        }
      });

      document.addEventListener('click', (e) => {
        if (!store.wifiMenuOpen) return;
        const inTrigger = e.target.closest('#wifi-net-select');
        const inList = e.target.closest('#wifi-net-listbox');
        if (!inTrigger && !inList) {
          store.wifiMenuOpen = false;
          render();
        }
      });

      document.getElementById('portal-mount').addEventListener('keydown', (e) => {
        const trigger = e.target.closest('#wifi-net-select');
        const listbox = e.target.closest('#wifi-net-listbox');

        if (trigger && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          e.preventDefault();
          if (!store.wifiMenuOpen) {
            store.wifiMenuOpen = true;
            render();
          }
          const opts = [...document.querySelectorAll('#wifi-net-listbox .wifi-opt-btn')];
          const target = opts.find((o) => o.getAttribute('aria-selected') === 'true') || opts[0];
          if (target) target.focus();
          return;
        }

        if (listbox) {
          const opts = [...listbox.querySelectorAll('.wifi-opt-btn')];
          const idx = opts.indexOf(document.activeElement);
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            const next = opts[idx + 1] || opts[0];
            if (next) next.focus();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const prev = opts[idx - 1] || opts[opts.length - 1];
            if (prev) prev.focus();
          } else if (e.key === 'Home') {
            e.preventDefault();
            if (opts[0]) opts[0].focus();
          } else if (e.key === 'End') {
            e.preventDefault();
            if (opts[opts.length - 1]) opts[opts.length - 1].focus();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            store.wifiMenuOpen = false;
            render();
            const btn = document.getElementById('wifi-net-select');
            if (btn) btn.focus();
          }
        }
      });

      document.getElementById('portal-mount').addEventListener('input', (e) => {
        const id = e.target.id;
        if (id === 'wifi-ssid-input') {
          store.wifiEdited = true; wifiEditRevision++;
          store.draftSsid = e.target.value;
          render();
        } else if (id === 'wifi-pwd-input') {
          store.wifiEdited = true; wifiEditRevision++;
          store.draftPassword = e.target.value;
          render();
        } else if (id === 'srv-url-input') {
          store.serviceEdited = true; serviceEditRevision++;
          store.draftServerUrl = e.target.value;
          render();
        } else if (id === 'srv-code-input') {
          store.serviceEdited = true; serviceEditRevision++;
          store.draftPairingCode = e.target.value;
          render();
        }
      });

      document.getElementById('portal-mount').addEventListener('compositionstart',()=>{composing=true;});
      document.getElementById('portal-mount').addEventListener('compositionend',()=>{composing=false;render();});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)status();});
      window.addEventListener('pageshow',status);
      window.addEventListener('online',status);
      render(); status().then(triggerScan);

    })();</script></body></html>

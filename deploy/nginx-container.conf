user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /var/cache/nginx/client-body;
    proxy_temp_path /var/cache/nginx/proxy;
    client_max_body_size 2147483646;
    client_body_timeout 120s;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/voice-memo-tls/certificate.pem;
        ssl_certificate_key /etc/voice-memo-tls/private-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        location / {
            # No URI suffix: retain / or the configured deployment prefix once.
            proxy_pass http://relay:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_next_upstream off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }
    }
}
